<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman Kelulusan - SMK Negeri 1 Kotamobagu</title>
  
  <!-- Frameworks & Fonts -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-primary: #0f172a;
      --accent-blue: #0066ff;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
    }

    * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }

    body {
      background: linear-gradient(180deg, #0f172a 0%, #1a1f35 100%);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100%;
    }

    .animated-bg {
      background:
        radial-gradient(ellipse at top left, rgba(14, 165, 233, 0.12), transparent 50%),
        radial-gradient(ellipse at top right, rgba(168, 85, 247, 0.12), transparent 50%),
        linear-gradient(180deg, #0f172a 0%, #1a1f35 100%);
      position: relative;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.25;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.1); }
    }

    .glass-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 102, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .btn-gradient {
      background: linear-gradient(135deg, #0066ff 0%, #0099ff 100%);
      transition: all 0.3s ease;
    }

    .btn-gradient:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 102, 255, 0.5);
    }

    .spinner {
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }
    .hidden { display: none; }
    
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      animation: confetti-fall 3s linear forwards;
    }
    @keyframes confetti-fall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(800px) rotate(720deg); opacity: 0; }
    }
  </style>
 </head>
 <body class="h-full animated-bg">
  <div class="orb" style="width: 400px; height: 400px; background: #3b82f6; top: -100px; left: -100px;"></div>
  <div class="orb" style="width: 500px; height: 500px; background: #8b5cf6; top: 30%; right: -150px; animation-delay: 2s;"></div>

  <main class="relative w-full min-h-full flex flex-col">
   <header class="relative z-10 w-full px-4 py-8 text-center">
     <img src="https://smkn1ktg.sch.id/logo/logo.gif" alt="Logo" class="h-24 mx-auto mb-4">
     <h1 class="font-display font-bold text-2xl uppercase tracking-wide">SMK Negeri 1 Kotamobagu</h1>
     <p class="text-slate-300 font-semibold mt-2">Tahun Pelajaran 2025/2026</p>
     <div id="logout-btn-container" class="hidden mt-4">
        <button id="logout-btn" class="px-4 py-2 rounded-lg bg-white/5 border border-white/10 text-sm">Keluar</button>
     </div>
   </header>

   <div class="flex-1 flex items-center justify-center px-4 py-8 relative z-10">
    <!-- LOADING -->
    <div id="loading-screen" class="text-center animate-fade-in-up">
     <div class="spinner w-12 h-12 mx-auto mb-4"></div>
     <p class="text-slate-300">Memuat data...</p>
    </div>

    <!-- LOGIN -->
    <div id="login-screen" class="hidden w-full max-w-md animate-fade-in-up">
     <div class="glass-card rounded-3xl p-8">
      <h2 class="font-display text-2xl font-bold mb-6 text-center">Cek Kelulusan</h2>
      <form id="login-form" class="space-y-5">
       <input type="text" id="nisn-input" placeholder="Masukkan 10 Digit NISN" class="w-full px-4 py-3.5 rounded-xl text-slate-900 bg-white" required maxlength="10">
       <p id="login-error" class="hidden text-sm text-red-400"></p>
       <button type="submit" id="login-submit" class="btn-gradient w-full py-3.5 rounded-xl font-bold text-white">Cek Hasil</button>
      </form>
     </div>
    </div>

    <!-- RESULT -->
    <div id="result-screen" class="hidden w-full max-w-2xl">
     <div id="result-content" class="glass-card rounded-3xl p-8 text-center">
       <!-- Konten diisi JS -->
     </div>
    </div>
   </div>

   <footer class="py-5 text-center text-xs text-slate-500">
    <p>© 2026 SMK Negeri 1 Kotamobagu</p>
   </footer>
  </main>

  <div id="confetti-container" class="fixed inset-0 pointer-events-none z-50"></div>

  <script>
  // GANTI SHEET_ID DENGAN ID SPREADSHEET ANDA YANG SUDAH DI-PUBLISH KE WEB (CSV)
  const SHEET_ID = '2PACX-1vQ7dKWe0slwGrGr6Q58QYTP1Plyh9_pv9jbPnh1Xo44mXmJfsHyQfQtPoKo50c1yw';
  const CSV_URL = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?output=csv`;

  let studentsData = [];
  lucide.createIcons();

  async function loadData() {
    try {
      const response = await fetch(CSV_URL);
      const data = await response.text();
      const rows = data.split('\n').slice(1); // Lewati header
      
      studentsData = rows.map(row => {
        const cols = row.split(',');
        return {
          nisn: cols[2]?.trim(),
          nama: cols[3]?.trim(),
          status: cols[9]?.trim(), // Kolom J (Status)
          skl: cols[10]?.trim()   // Kolom K (Link SKL)
        };
      }).filter(s => s.nisn);

      document.getElementById('loading-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    } catch (e) {
      alert("Gagal memuat data. Pastikan Spreadsheet sudah di-publish ke web sebagai CSV.");
    }
  }

  document.getElementById('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = document.getElementById('nisn-input').value.trim();
    const student = studentsData.find(s => s.nisn === input);

    if (student) {
      showResult(student);
    } else {
      const err = document.getElementById('login-error');
      err.textContent = "NISN tidak ditemukan.";
      err.classList.remove('hidden');
    }
  });

  function showResult(s) {
    const isPassed = s.status?.toUpperCase() === 'LULUS';
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('logout-btn-container').classList.remove('hidden');

    const content = document.getElementById('result-content');
    content.innerHTML = `
      <h2 class="text-4xl font-bold ${isPassed ? 'text-green-400' : 'text-red-400'} mb-4">
        ${isPassed ? 'LULUS' : 'BELUM LULUS'}
      </h2>
      <p class="mb-6">Nama: ${s.nama}<br>NISN: ${s.nisn}</p>
      ${isPassed && s.skl ? `<a href="${s.skl}" target="_blank" class="btn-gradient inline-block px-6 py-3 rounded-xl text-white font-bold">Download SKL</a>` : ''}
    `;

    if (isPassed) launchConfetti();
  }

  function launchConfetti() {
    const container = document.getElementById('confetti-container');
    for (let i = 0; i < 50; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + '%';
      c.style.background = ['#3b82f6', '#10b981', '#f59e0b'][Math.floor(Math.random()*3)];
      c.style.animationDelay = Math.random() * 2 + 's';
      container.appendChild(c);
    }
  }

  document.getElementById('logout-btn').addEventListener('click', () => location.reload());

  loadData();
  </script>
 </body>
</html>
