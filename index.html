<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pengumuman Kelulusan SMK Negeri 1 Kotamobagu</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --bg: #0a0e27; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: #f5f3ff; margin: 0; -webkit-tap-highlight-color: transparent; }
    .glass { background: rgba(21, 26, 58, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .hidden { display: none !important; }
    
    /* Perbaikan Input untuk Mobile */
    input[type="text"] { font-size: 16px !important; } /* Mencegah auto-zoom di iPhone */
    
    #countdown-overlay {
      background: rgba(10, 14, 39, 0.98);
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
  </style>
</head>
<body class="h-full flex flex-col">

  <div id="countdown-overlay">
    <div id="number-display" class="text-8xl font-bold text-amber-400">3</div>
  </div>

  <div id="app-container" class="relative z-10 flex-grow flex flex-col items-center px-4 py-8">
    
    <!-- Section: Countdown -->
    <section id="section-countdown" class="w-full max-w-xl text-center">
      <img id="display-logo" src="" class="w-20 mx-auto mb-4" alt="Logo">
      <h1 class="text-2xl font-bold mb-6">PENGUMUMAN KELULUSAN<br><span class="text-amber-400" id="display-school-name">SMK NEGERI 1 KOTAMOBAGU</span></h1>
      
      <div class="glass rounded-2xl p-6 mb-8 grid grid-cols-4 gap-2">
        <div class="text-center"><div class="text-2xl font-bold" id="days">00</div><p class="text-[10px] opacity-50">HARI</p></div>
        <div class="text-center"><div class="text-2xl font-bold" id="hours">00</div><p class="text-[10px] opacity-50">JAM</p></div>
        <div class="text-center"><div class="text-2xl font-bold" id="minutes">00</div><p class="text-[10px] opacity-50">MENIT</p></div>
        <div class="text-center"><div class="text-2xl font-bold text-amber-400" id="seconds">00</div><p class="text-[10px] opacity-50">DETIK</p></div>
      </div>
      
      <button id="btn-to-login" disabled class="w-full py-4 rounded-xl font-bold opacity-50 bg-slate-800 text-slate-400">
        Menunggu Waktu Pengumuman
      </button>
    </section>

    <!-- Section: Login -->
    <section id="section-login" class="hidden w-full max-w-md">
      <div class="glass p-6 rounded-3xl text-center shadow-2xl">
        <h2 class="text-xl font-bold mb-6">Masukkan NISN</h2>
        <form id="form-nisn" class="space-y-4">
          <input type="text" id="input-nisn" pattern="\d*" inputmode="numeric" maxlength="10" placeholder="10 Digit NISN" class="w-full px-4 py-4 rounded-xl bg-white text-slate-900 font-bold text-center text-xl outline-none border-2 border-transparent focus:border-amber-400 transition-all">
          <button type="submit" class="w-full bg-amber-500 text-slate-900 py-4 rounded-xl font-bold text-lg">Cek Sekarang</button>
        </form>
        <p id="error-msg" class="text-red-400 mt-4 hidden text-sm font-bold">Data tidak ditemukan. Pastikan NISN benar.</p>
      </div>
    </section>

    <!-- Section: Result -->
    <section id="section-result" class="hidden w-full max-w-md">
      <div id="result-card" class="glass p-6 rounded-3xl text-center"></div>
    </section>

  </div>

  <!-- Admin Gear Icon -->
  <div class="fixed bottom-4 right-4 opacity-20" onclick="openAdmin()">
    <i data-lucide="settings" class="w-5 h-5"></i>
  </div>

  <script>
    // Konfigurasi Default
    let config = {
      csv: localStorage.getItem('cfg_csv') || '',
      target: localStorage.getItem('cfg_date') || '2026-05-04T15:00:00',
      schoolName: localStorage.getItem('cfg_name') || 'SMK NEGERI 1 KOTAMOBAGU',
      logoUrl: localStorage.getItem('cfg_logo') || 'https://smkn1ktg.sch.id/logo/logo.gif'
    };

    let studentsData = [];

    // 1. Fungsi Load Data dengan Anti-Cache untuk Mobile
    async function loadData() {
      if(!config.csv) return;
      try {
        // Menambahkan timestamp agar HP selalu mengambil data terbaru dari server
        const cacheBuster = `&t=${new Date().getTime()}`;
        const res = await fetch(config.csv + cacheBuster);
        const text = await res.text();
        
        // Parsing CSV yang lebih aman untuk mobile browser
        const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
        studentsData = rows.slice(1).map(r => {
          const c = r.split(',').map(item => item.trim().replace(/^"|"$/g, ''));
          return { nisn: c[2], nama: c[3], jurusan: c[8], status: c[9], skl: c[10] };
        });
      } catch (e) {
        console.error("Gagal memuat data");
      }
    }

    // 2. Countdown Logic
    function updateCountdown() {
      const now = new Date().getTime();
      const target = new Date(config.target).getTime();
      const diff = target - now;

      if (diff <= 0) {
        const btn = document.getElementById('btn-to-login');
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'bg-slate-800');
        btn.classList.add('bg-amber-500', 'text-slate-900');
        btn.innerText = "Buka Pengumuman";
        return;
      }

      const d = Math.floor(diff / 864e5), h = Math.floor((diff % 864e5) / 36e5), m = Math.floor((diff % 36e5) / 6e4), s = Math.floor((diff % 6e4) / 1e3);
      document.getElementById('days').innerText = String(d).padStart(2, '0');
      document.getElementById('hours').innerText = String(h).padStart(2, '0');
      document.getElementById('minutes').innerText = String(m).padStart(2, '0');
      document.getElementById('seconds').innerText = String(s).padStart(2, '0');
    }

    // 3. Login & Result Logic
    document.getElementById('btn-to-login').onclick = () => {
      document.getElementById('section-countdown').classList.add('hidden');
      document.getElementById('section-login').classList.remove('hidden');
    };

    document.getElementById('form-nisn').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('input-nisn').value.trim();
      const s = studentsData.find(x => x.nisn === input);
      
      if (s) {
        document.getElementById('error-msg').classList.add('hidden');
        showCountdownOverlay(() => {
          document.getElementById('section-login').classList.add('hidden');
          document.getElementById('section-result').classList.remove('hidden');
          renderResult(s);
        });
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    };

    function showCountdownOverlay(callback) {
      const overlay = document.getElementById('countdown-overlay');
      const display = document.getElementById('number-display');
      overlay.style.display = 'flex';
      let count = 3;
      const timer = setInterval(() => {
        count--;
        if (count > 0) display.innerText = count;
        else { clearInterval(timer); overlay.style.display = 'none'; callback(); }
      }, 800);
    }

    function renderResult(s) {
      const isLulus = s.status?.toUpperCase() === 'LULUS';
      if(isLulus) confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      
      document.getElementById('result-card').innerHTML = `
        <h2 class="text-2xl font-bold mb-4 ${isLulus ? 'text-green-400' : 'text-red-400'}">
          ${isLulus ? 'SELAMAT, ANDA LULUS!' : 'MAAF, ANDA BELUM LULUS'}
        </h2>
        <div class="text-left bg-white/5 p-4 rounded-xl mb-6">
          <p class="text-[10px] text-amber-400 uppercase">Nama Siswa</p>
          <p class="font-bold mb-3">${s.nama}</p>
          <p class="text-[10px] text-amber-400 uppercase">Jurusan</p>
          <p class="font-bold">${s.jurusan || '-'}</p>
        </div>
        ${isLulus && s.skl ? `<a href="${s.skl}" class="block w-full bg-green-500 text-white py-3 rounded-lg font-bold mb-4">Unduh SKL</a>` : ''}
        <button onclick="location.reload()" class="text-slate-500 text-sm italic underline">Kembali</button>
      `;
    }

    // 4. Admin Setup
    function openAdmin() {
      const pw = prompt("Password Admin:");
      if (pw === "admin123") {
        const url = prompt("Link CSV Google Sheets:", config.csv);
        if(url) {
          localStorage.setItem('cfg_csv', url);
          location.reload();
        }
      }
    }

    // Initialize
    document.getElementById('display-school-name').innerText = config.schoolName;
    document.getElementById('display-logo').src = config.logoUrl;
    loadData();
    setInterval(updateCountdown, 1000);
    lucide.createIcons();
  </script>
</body>
</html>
