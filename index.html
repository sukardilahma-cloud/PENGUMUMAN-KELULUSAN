<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman Kelulusan</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --bg: #0a0e27; --amber: #fbbf24; }
    body { font-family: 'Outfit', sans-serif; background: var(--bg); color: #f5f3ff; margin: 0; overflow-x: hidden; }
    .serif { font-family: 'Fraunces', serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass { background: rgba(21, 26, 58, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .hidden { display: none !important; }
    .btn-gradient { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); color: #0a0e27; }
  </style>
</head>
<body class="h-full">
  <div id="starfield" class="fixed inset-0 pointer-events-none"></div>

  <div id="app-container" class="relative z-10 min-h-full flex flex-col items-center px-4 py-12">
    <!-- Section: Countdown -->
    <section id="section-countdown" class="w-full max-w-3xl text-center">
      <img id="display-logo" src="" class="w-24 mx-auto mb-8" alt="Logo">
      <header class="inline-block rounded-full px-4 py-2 mb-8 border border-amber-400/30 bg-amber-400/10">
        <span id="display-school-name" class="text-xs sm:text-sm font-medium text-amber-100"></span>
      </header>

      <h1 class="serif text-4xl sm:text-6xl font-bold mb-4">Sebentar lagi,<br><span class="text-amber-400 italic">momen itu tiba</span></h1>
      
      <div class="glass rounded-3xl p-8 my-10">
        <div class="grid grid-cols-4 gap-4">
          <div class="text-center"><div class="mono text-3xl sm:text-5xl font-bold" id="days">00</div><p class="text-xs opacity-50 uppercase mt-2">Hari</p></div>
          <div class="text-center"><div class="mono text-3xl sm:text-5xl font-bold" id="hours">00</div><p class="text-xs opacity-50 uppercase mt-2">Jam</p></div>
          <div class="text-center"><div class="mono text-3xl sm:text-5xl font-bold" id="minutes">00</div><p class="text-xs opacity-50 uppercase mt-2">Menit</p></div>
          <div class="text-center"><div class="mono text-3xl sm:text-5xl font-bold text-amber-400" id="seconds">00</div><p class="text-xs text-amber-400 uppercase mt-2">Detik</p></div>
        </div>
      </div>

      <button id="btn-to-login" disabled class="px-8 py-4 rounded-xl font-bold opacity-50 cursor-not-allowed border-2 border-amber-400/50 text-amber-400 flex items-center gap-2 mx-auto transition-all">
        <i data-lucide="lock" class="w-5 h-5"></i> <span id="btn-text">Tunggu Waktu Pengumuman</span>
      </button>
    </section>

    <!-- Section: Login -->
    <section id="section-login" class="hidden w-full max-w-md mt-20">
      <div class="glass p-8 rounded-3xl text-center">
        <h2 class="serif text-2xl font-bold mb-6">Input NISN Siswa</h2>
        <form id="form-nisn" class="space-y-4">
          <input type="text" id="input-nisn" maxlength="10" placeholder="10 Digit NISN" class="w-full px-4 py-4 rounded-xl bg-white text-slate-900 font-bold text-center text-xl outline-none">
          <button type="submit" class="btn-gradient w-full py-4 rounded-xl font-bold">Periksa Kelulusan</button>
        </form>
        <p id="error-msg" class="text-red-400 mt-4 hidden">NISN tidak ditemukan!</p>
      </div>
    </section>

    <!-- Section: Result -->
    <section id="section-result" class="hidden w-full max-w-2xl mt-20">
      <div id="result-card" class="glass p-10 rounded-3xl text-center"></div>
    </section>
  </div>

  <!-- ADMIN BUTTON (LOCK ICON) -->
  <div class="fixed bottom-4 right-4 z-50">
    <button onclick="openAdmin()" class="p-3 bg-white/5 hover:bg-white/10 rounded-full border border-white/10 transition-all text-white/20 hover:text-white/60">
      <i data-lucide="lock" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- ADMIN PANEL MODAL -->
  <div id="admin-panel" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
    <div class="glass w-full max-w-md p-8 rounded-3xl relative overflow-y-auto max-h-[90vh]">
      <button onclick="closeAdmin()" class="absolute top-4 right-4 opacity-50 hover:opacity-100"><i data-lucide="x" class="w-6 h-6"></i></button>
      <h2 class="serif text-xl font-bold mb-6 flex items-center gap-2"><i data-lucide="settings" class="w-5 h-5 text-amber-400"></i> Pengaturan Sistem</h2>
      
      <div class="space-y-4 text-left">
        <div>
          <label class="text-xs text-violet-300 uppercase font-bold">Nama Sekolah</label>
          <input type="text" id="admin-school-name" class="w-full mt-1 px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-sm outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="text-xs text-violet-300 uppercase font-bold">Link Logo Sekolah (URL)</label>
          <input type="text" id="admin-logo-url" class="w-full mt-1 px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-sm outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="text-xs text-violet-300 uppercase font-bold">Link CSV Google Sheets</label>
          <input type="text" id="admin-csv" class="w-full mt-1 px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-sm outline-none focus:border-amber-400">
        </div>
        <div>
          <label class="text-xs text-violet-300 uppercase font-bold">Tanggal & Waktu Buka</label>
          <input type="datetime-local" id="admin-date" class="w-full mt-1 px-4 py-2 bg-white/5 border border-white/10 rounded-lg text-sm outline-none focus:border-amber-400">
        </div>
        <button onclick="saveAdminSettings()" class="btn-gradient w-full py-3 rounded-xl font-bold mt-4">Simpan Semua Perubahan</button>
      </div>
    </div>
  </div>

  <script>
    // --- CONFIGURATION ---
    let config = {
      csv: localStorage.getItem('cfg_csv') || 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7dKWe0slwGrGr6Q58QYTP1Plyh9_pv9jbPnh1Xo44mXmJfsHyQfQtPoKo50c1yw/pub?output=csv',
      target: localStorage.getItem('cfg_date') || '2026-05-04T15:00:00',
      schoolName: localStorage.getItem('cfg_name') || 'SMK Negeri 1 Kotamobagu',
      logoUrl: localStorage.getItem('cfg_logo') || 'https://smkn1ktg.sch.id/logo/logo.gif'
    };

    let studentsData = [];

    // --- APPLY INITIAL CONFIG ---
    document.getElementById('display-school-name').innerText = config.schoolName;
    document.getElementById('display-logo').src = config.logoUrl;
    
    // --- ADMIN LOGIC ---
    function openAdmin() {
      const pass = prompt("Masukkan Password Admin:");
      if (pass === "admin123") {
        document.getElementById('admin-school-name').value = config.schoolName;
        document.getElementById('admin-logo-url').value = config.logoUrl;
        document.getElementById('admin-csv').value = config.csv;
        document.getElementById('admin-date').value = config.target.substring(0, 16);
        document.getElementById('admin-panel').classList.remove('hidden');
      } else if (pass !== null) {
        alert("Password Salah!");
      }
    }

    function closeAdmin() { document.getElementById('admin-panel').classList.add('hidden'); }

    function saveAdminSettings() {
      localStorage.setItem('cfg_name', document.getElementById('admin-school-name').value);
      localStorage.setItem('cfg_logo', document.getElementById('admin-logo-url').value);
      localStorage.setItem('cfg_csv', document.getElementById('admin-csv').value);
      localStorage.setItem('cfg_date', document.getElementById('admin-date').value);
      
      alert("Pengaturan Berhasil Disimpan!");
      location.reload();
    }

    // --- DATA & COUNTDOWN LOGIC ---
    async function loadData() {
      try {
        const res = await fetch(config.csv);
        const text = await res.text();
        const rows = text.split('\n').slice(1);
        studentsData = rows.map(r => {
          const c = r.split(',');
          return { nisn: c[2]?.trim(), nama: c[3]?.trim(), status: c[9]?.trim(), skl: c[10]?.trim() };
        });
      } catch (e) { console.error("Gagal memuat CSV"); }
    }

    function updateCountdown() {
      const diff = new Date(config.target) - new Date();
      const btn = document.getElementById('btn-to-login');

      if (diff <= 0) {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
        btn.classList.add('btn-gradient', 'text-slate-900');
        document.getElementById('btn-text').innerText = "Cek Hasil Kelulusan Sekarang";
        return;
      }

      const d = Math.floor(diff / 864e5), h = Math.floor((diff % 864e5) / 36e5), m = Math.floor((diff % 36e5) / 6e4), s = Math.floor((diff % 6e4) / 1e3);
      document.getElementById('days').innerText = String(d).padStart(2, '0');
      document.getElementById('hours').innerText = String(h).padStart(2, '0');
      document.getElementById('minutes').innerText = String(m).padStart(2, '0');
      document.getElementById('seconds').innerText = String(s).padStart(2, '0');
    }

    // --- NAVIGATION ---
    document.getElementById('btn-to-login').onclick = () => {
      document.getElementById('section-countdown').classList.add('hidden');
      document.getElementById('section-login').classList.remove('hidden');
    };

    document.getElementById('form-nisn').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('input-nisn').value.trim();
      const s = studentsData.find(x => x.nisn === input);
      if (s) {
        document.getElementById('section-login').classList.add('hidden');
        document.getElementById('section-result').classList.remove('hidden');
        const isLulus = s.status?.toUpperCase() === 'LULUS';
        document.getElementById('result-card').innerHTML = `
          <h2 class="serif text-4xl font-bold mb-4 ${isLulus ? 'text-green-400' : 'text-red-400'}">${isLulus ? 'LULUS' : 'BELUM LULUS'}</h2>
          <p class="text-xl mb-6">${s.nama}<br><span class="opacity-50">${s.nisn}</span></p>
          ${isLulus && s.skl ? `<a href="${s.skl}" target="_blank" class="btn-gradient px-8 py-3 rounded-xl font-bold inline-block">Download SKL</a>` : ''}
          <button onclick="location.reload()" class="block w-full mt-8 opacity-30 text-sm italic">Kembali</button>
        `;
        lucide.createIcons();
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    };

    // --- STARFIELD ---
    const field = document.getElementById('starfield');
    for (let i = 0; i < 60; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = (Math.random() * 2 + 1) + 'px';
      star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      field.appendChild(star);
    }

    loadData();
    setInterval(updateCountdown, 1000);
    lucide.createIcons();
  </script>
</body>
</html>
