<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman Kelulusan - SMK Negeri 1 Kotamobagu</title>
  
  <!-- Scripts & Fonts -->
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --accent-blue: #0066ff;
      --accent-cyan: #0ea5e9;
      --accent-purple: #6366f1;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
    }

    * { font-family: 'Plus Jakarta Sans', sans-serif; box-sizing: border-box; }
    .font-display { font-family: 'Space Grotesk', sans-serif; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(180deg, #0f172a 0%, #1a1f35 100%);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* Animated gradient background */
    .animated-bg {
      background:
        radial-gradient(ellipse at top left, rgba(14, 165, 233, 0.12), transparent 50%),
        radial-gradient(ellipse at top right, rgba(168, 85, 247, 0.12), transparent 50%),
        radial-gradient(ellipse at bottom, rgba(34, 197, 94, 0.08), transparent 60%),
        linear-gradient(180deg, #0f172a 0%, #1a1f35 100%);
      position: relative;
    }

    .animated-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* Floating orbs */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.25;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.1); }
    }

    /* Glass card */
    .glass-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 102, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .btn-gradient {
      background: linear-gradient(135deg, #0066ff 0%, #0099ff 100%);
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 102, 255, 0.4);
    }
    .btn-gradient:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 102, 255, 0.5);
    }

    .btn-success {
      background: linear-gradient(135deg, #22c55e 0%, #10b981 100%);
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
    }
    .btn-success:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(34, 197, 94, 0.5);
    }

    .input-modern {
      background: rgba(255, 255, 255, 0.9);
      border: 1.5px solid rgba(0, 102, 255, 0.25);
      color: #0f172a;
      transition: all 0.3s ease;
    }
    .input-modern:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.2);
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-scale-in { animation: scaleIn 0.5s ease-out forwards; }

    .confetti-item {
      position: fixed;
      pointer-events: none;
      animation: confetti-fall 3s ease-in forwards;
    }

    @keyframes confetti-fall {
      to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }

    .hidden { display: none; }
  </style>
</head>
<body class="h-full">
  <div class="animated-bg h-full overflow-auto">
    <!-- Orbs -->
    <div class="orb" style="width: 400px; height: 400px; background: #0ea5e9; top: -100px; left: -100px;"></div>
    <div class="orb" style="width: 300px; height: 300px; background: #a855f7; top: 50%; right: -50px; animation-delay: 2s;"></div>

    <div class="relative z-10 flex items-center justify-center min-h-full py-8 px-4">
      <div class="w-full max-w-md">
        
        <!-- Header -->
        <div class="text-center mb-8">
          <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-2xl mb-4">
            <i data-lucide="graduation-cap" class="text-white" style="width: 32px; height: 32px;"></i>
          </div>
          <h1 class="font-display text-4xl font-bold mb-2">SMK Negeri 1 Kotamobagu</h1>
          <p class="text-cyan-400 text-sm">Pengumuman Kelulusan Tahun Ajaran 2024/2025</p>
        </div>

        <!-- Form Card -->
        <div id="formContainer" class="glass-card rounded-2xl p-8 mb-6">
          <h2 class="font-display text-2xl font-bold mb-2">Cek Status Kelulusan</h2>
          <p class="text-sm text-gray-400 mb-6">Masukkan nomor NISN Anda untuk melihat hasil</p>
          <form id="graduationForm" onsubmit="handleSubmit(event)">
            <div class="mb-6">
              <label for="nisn" class="block text-sm font-medium mb-2">Nomor NISN</label>
              <input type="text" id="nisn" placeholder="Contoh: 0012345678" class="input-modern w-full px-4 py-3 rounded-lg" maxlength="10" required>
              <p class="text-xs text-gray-500 mt-1">Masukkan 10 digit NISN Anda</p>
            </div>
            <button type="submit" class="btn-gradient w-full py-3 rounded-lg font-semibold flex items-center justify-center gap-2 text-white">
              <i data-lucide="search" style="width: 18px; height: 18px;"></i> Cek Hasil
            </button>
          </form>
        </div>

        <!-- Result Card -->
        <div id="resultCard" class="glass-card rounded-2xl p-8 hidden animate-scale-in">
          <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-green-400 to-emerald-600 rounded-full mb-4">
              <i data-lucide="check-circle-2" class="text-white" style="width: 40px; height: 40px;"></i>
            </div>
            <h2 class="font-display text-3xl font-bold text-green-400 mb-2">LULUS</h2>
            <p class="text-gray-300">Selamat Anda telah dinyatakan lulus</p>
          </div>
          
          <div class="bg-slate-700 bg-opacity-50 rounded-lg p-4 mb-6 space-y-3">
            <div class="flex justify-between text-sm"><span class="text-gray-400">Nomor NISN:</span> <span id="resultNisn" class="font-semibold"></span></div>
            <div class="flex justify-between text-sm"><span class="text-gray-400">Nama Siswa:</span> <span id="resultName" class="font-semibold"></span></div>
            <div class="flex justify-between text-sm"><span class="text-gray-400">Tanggal:</span> <span id="resultDate" class="font-semibold"></span></div>
          </div>

          <div class="flex gap-3">
            <button onclick="printResult()" class="btn-success flex-1 py-2 rounded-lg font-semibold flex items-center justify-center gap-2 text-white">
              <i data-lucide="printer" style="width: 18px; height: 18px;"></i> Cetak
            </button>
            <button onclick="resetForm()" class="flex-1 py-2 rounded-lg font-semibold border border-cyan-400 text-cyan-400 hover:bg-cyan-400 hover:bg-opacity-10 transition">
              Kembali
            </button>
          </div>
        </div>

        <div class="text-center text-xs text-gray-500 mt-8">
          <p>© 2024 SMK Negeri 1 Kotamobagu</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Inisialisasi ikon
    lucide.createIcons();

    function handleSubmit(event) {
      event.preventDefault();
      const nisnValue = document.getElementById('nisn').value;
      
      if (nisnValue.length < 10) {
        alert('NISN harus 10 digit');
        return;
      }

      document.getElementById('formContainer').classList.add('hidden');
      document.getElementById('resultNisn').textContent = nisnValue;
      document.getElementById('resultName').textContent = "SISWA - " + nisnValue; // Placeholder
      document.getElementById('resultDate').textContent = new Date().toLocaleDateString('id-ID', {
        day: 'numeric', month: 'long', year: 'numeric'
      });

      document.getElementById('resultCard').classList.remove('hidden');
      createConfetti();
    }

    function resetForm() {
      document.getElementById('graduationForm').reset();
      document.getElementById('formContainer').classList.remove('hidden');
      document.getElementById('resultCard').classList.add('hidden');
    }

    function createConfetti() {
      const colors = ['#0066ff', '#0ea5e9', '#6366f1', '#10b981', '#f59e0b'];
      for (let i = 0; i < 50; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti-item';
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.top = '-10px';
        confetti.style.width = Math.random() * 8 + 4 + 'px';
        confetti.style.height = confetti.style.width;
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.borderRadius = '50%';
        confetti.style.animationDelay = Math.random() * 0.5 + 's';
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 3000);
      }
    }

    function printResult() {
      window.print();
    }
  </script>
</body>
</html>
