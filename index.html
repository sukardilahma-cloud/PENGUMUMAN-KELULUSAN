<!doctype html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pengumuman Kelulusan SMK Negeri 1 Kotamobagu</title>
  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --bg: #0a0e27; --amber: #fbbf24; }
    body { 
      font-family: 'Outfit', sans-serif; 
      background: var(--bg); 
      color: #f5f3ff; 
      margin: 0; 
      overflow-x: hidden;
      /* Mencegah delay klik di mobile */
      touch-action: manipulation;
    }
    .serif { font-family: 'Fraunces', serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .glass { background: rgba(21, 26, 58, 0.7); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; } 50% { opacity: 1; } }
    .hidden { display: none !important; }
    .btn-gradient { background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); color: #0a0e27; }
    
    /* Perbaikan Input Mobile agar tidak zoom otomatis saat diketik */
    input[type="text"] { font-size: 16px !important; }

    #countdown-overlay {
      background: rgba(10, 14, 39, 0.98);
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    .count-number { font-size: 8rem; font-weight: 800; animation: zoomFade 1s ease-in-out infinite; }
    @keyframes zoomFade {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body class="h-full flex flex-col">
  <div id="starfield" class="fixed inset-0 pointer-events-none"></div>

  <div id="countdown-overlay">
    <div id="number-display" class="count-number serif text-amber-400">3</div>
  </div>

  <div id="app-container" class="relative z-10 flex-grow flex flex-col items-center px-4 py-8">
    <!-- Section: Landing -->
    <section id="section-countdown" class="w-full max-w-xl text-center">
      <img id="display-logo" src="" class="w-20 mx-auto mb-4" alt="Logo">
      <header class="inline-block rounded-full px-4 py-1 mb-4 border border-amber-400/30 bg-amber-400/10">
        <span id="display-school-name" class="text-[10px] font-bold tracking-widest text-amber-100 uppercase">SMK NEGERI 1 KOTAMOBAGU</span>
      </header>
      <h1 class="serif text-3xl font-bold mb-2">HASIL KELULUSAN<br><span class="text-amber-400 italic text-2xl">TP. 2025/2026</span></h1>
      
      <div class="glass rounded-2xl p-6 my-8 grid grid-cols-4 gap-2">
        <div class="text-center"><div class="mono text-2xl font-bold" id="days">00</div><p class="text-[9px] opacity-50 uppercase">Hari</p></div>
        <div class="text-center"><div class="mono text-2xl font-bold" id="hours">00</div><p class="text-[9px] opacity-50 uppercase">Jam</p></div>
        <div class="text-center"><div class="mono text-2xl font-bold" id="minutes">00</div><p class="text-[9px] opacity-50 uppercase">Menit</p></div>
        <div class="text-center"><div class="mono text-2xl font-bold text-amber-400" id="seconds">00</div><p class="text-[9px] text-amber-400 uppercase font-bold">Detik</p></div>
      </div>
      
      <button id="btn-to-login" disabled class="w-full py-4 rounded-xl font-bold opacity-50 bg-white/5 border border-white/10 text-white flex justify-center items-center gap-2 transition-all">
        <i data-lucide="clock" class="w-5 h-5"></i> <span id="btn-text">Menunggu Waktu</span>
      </button>
    </section>

    <!-- Section: Login -->
    <section id="section-login" class="hidden w-full max-w-md">
      <div class="glass p-6 rounded-3xl text-center">
        <h2 class="serif text-xl font-bold mb-4">Cek Status Siswa</h2>
        <form id="form-nisn" class="space-y-4">
          <input type="text" id="input-nisn" pattern="\d*" inputmode="numeric" maxlength="10" placeholder="Masukkan 10 Digit NISN" class="w-full px-4 py-4 rounded-xl bg-white text-slate-900 font-bold text-center text-xl outline-none focus:ring-4 focus:ring-amber-400/30 transition-all">
          <button type="submit" class="btn-gradient w-full py-4 rounded-xl font-bold text-lg shadow-lg">Lihat Hasil</button>
        </form>
        <p id="error-msg" class="text-red-400 mt-4 hidden font-bold text-sm italic">NISN tidak ditemukan!</p>
      </div>
    </section>

    <!-- Section: Result -->
    <section id="section-result" class="hidden w-full max-w-md mt-4">
      <div id="result-card" class="glass p-6 rounded-3xl text-center"></div>
    </section>
  </div>

  <div class="fixed bottom-4 right-4 z-50 opacity-30 hover:opacity-100 transition-opacity">
    <button onclick="openAdmin()" class="p-2 bg-white/5 rounded-full border border-white/10 text-white">
      <i data-lucide="settings" class="w-4 h-4"></i>
    </button>
  </div>

  <script>
    let config = {
      csv: localStorage.getItem('cfg_csv') || '',
      target: localStorage.getItem('cfg_date') || '2026-05-04T15:00:00',
      schoolName: localStorage.getItem('cfg_name') || 'SMK Negeri 1 Kotamobagu',
      logoUrl: localStorage.getItem('cfg_logo') || 'https://smkn1ktg.sch.id/logo/logo.gif'
    };

    let studentsData = [];

    // PERBAIKAN UTAMA: Penanganan Cache Mobile & Parsing CSV yang lebih kuat
    async function loadData() {
      if (!config.csv || config.csv === 'URL_CSV_ANDA') return;
      try {
        // Tambahkan timestamp agar browser mobile tidak mengambil data lama dari cache
        const cacheBuster = config.csv.includes('?') ? `&t=${Date.now()}` : `?t=${Date.now()}`;
        const res = await fetch(config.csv + cacheBuster);
        if (!res.ok) throw new Error("Gagal mengambil data");
        
        const text = await res.text();
        // Regex untuk memisahkan baris yang mendukung berbagai format (Windows/Unix)
        const rows = text.split(/\r?\n/).filter(row => row.trim() !== "");
        
        studentsData = rows.slice(1).map(r => {
          // Menghapus tanda kutip dan spasi di setiap kolom
          const c = r.split(',').map(item => item.trim().replace(/^"|"$/g, ''));
          return { 
            nisn: c[2], 
            nama: c[3], 
            jurusan: c[8], 
            status: c[9], 
            skl: c[10] 
          };
        });
        console.log("Database Mobile Ready:", studentsData.length);
      } catch (e) {
        console.error("Gagal memuat data:", e);
      }
    }

    function updateCountdown() {
      const now = new Date().getTime();
      const target = new Date(config.target).getTime();
      const diff = target - now;
      const btn = document.getElementById('btn-to-login');

      if (diff <= 0) {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'bg-white/5');
        btn.classList.add('btn-gradient', 'text-slate-900', 'scale-105');
        document.getElementById('btn-text').innerText = "Buka Pengumuman";
        return;
      }

      const d = Math.floor(diff / 864e5), 
            h = Math.floor((diff % 864e5) / 36e5), 
            m = Math.floor((diff % 36e5) / 6e4), 
            s = Math.floor((diff % 6e4) / 1e3);
            
      document.getElementById('days').innerText = String(d).padStart(2, '0');
      document.getElementById('hours').innerText = String(h).padStart(2, '0');
      document.getElementById('minutes').innerText = String(m).padStart(2, '0');
      document.getElementById('seconds').innerText = String(s).padStart(2, '0');
    }

    document.getElementById('btn-to-login').onclick = () => {
      document.getElementById('section-countdown').classList.add('hidden');
      document.getElementById('section-login').classList.remove('hidden');
      window.scrollTo(0,0);
    };

    document.getElementById('form-nisn').onsubmit = (e) => {
      e.preventDefault();
      const input = document.getElementById('input-nisn').value.trim();
      const s = studentsData.find(x => x.nisn === input);
      
      if (s) {
        document.getElementById('error-msg').classList.add('hidden');
        const overlay = document.getElementById('countdown-overlay');
        const display = document.getElementById('number-display');
        overlay.style.display = 'flex';
        
        let count = 3;
        display.innerText = count;
        const timer = setInterval(() => {
          count--;
          if (count > 0) display.innerText = count;
          else {
            clearInterval(timer);
            overlay.style.display = 'none';
            showResult(s);
          }
        }, 800);
      } else {
        document.getElementById('error-msg').classList.remove('hidden');
      }
    };

    function showResult(s) {
      document.getElementById('section-login').classList.add('hidden');
      document.getElementById('section-result').classList.remove('hidden');
      const isLulus = s.status?.toUpperCase() === 'LULUS';
      
      if(isLulus) {
        confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
      }

      document.getElementById('result-card').innerHTML = `
        <div class="mb-4"><i data-lucide="${isLulus ? 'party-popper' : 'frown'}" class="w-16 h-16 mx-auto ${isLulus ? 'text-green-400' : 'text-red-400'}"></i></div>
        <h2 class="serif text-4xl font-black ${isLulus ? 'text-green-400' : 'text-red-400'} mb-6 tracking-tight">${isLulus ? 'LULUS' : 'TIDAK LULUS'}</h2>
        <div class="bg-white/5 rounded-2xl p-5 mb-6 text-left border border-white/10">
          <div class="mb-3 border-b border-white/5 pb-2"><p class="text-amber-400 text-[10px] uppercase font-bold">Nama Lengkap</p><p class="text-lg font-bold">${s.nama}</p></div>
          <div class="mb-3 border-b border-white/5 pb-2"><p class="text-amber-400 text-[10px] uppercase font-bold">NISN</p><p class="mono text-white/80">${s.nisn}</p></div>
          <div><p class="text-amber-400 text-[10px] uppercase font-bold">Jurusan</p><p class="text-white/80">${s.jurusan || '-'}</p></div>
        </div>
        ${isLulus && s.skl ? `<a href="${s.skl}" target="_blank" class="btn-gradient w-full py-4 rounded-xl font-bold flex justify-center items-center gap-2"><i data-lucide="download" class="w-5 h-5"></i> Unduh SKL (PDF)</a>` : ''}
        <button onclick="location.reload()" class="block w-full mt-6 text-white/20 text-xs italic underline">Kembali</button>
      `;
      lucide.createIcons();
    }

    function openAdmin() {
      const pass = prompt("Password Admin:");
      if (pass === "admin123") {
        const newCsv = prompt("Link CSV (G-Sheets):", config.csv);
        const newDate = prompt("Waktu Buka (YYYY-MM-DDTHH:MM):", config.target);
        if(newCsv) localStorage.setItem('cfg_csv', newCsv);
        if(newDate) localStorage.setItem('cfg_date', newDate);
        location.reload();
      }
    }

    // Initialize
    document.querySelectorAll('#display-school-name').forEach(el => el.innerText = config.schoolName);
    document.getElementById('display-logo').src = config.logoUrl;
    loadData();
    setInterval(updateCountdown, 1000);
    lucide.createIcons();
    
    // Star Background
    const field = document.getElementById('starfield');
    for (let i = 0; i < 40; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.width = (Math.random() * 2 + 1) + 'px'; star.style.height = star.style.width;
      star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      field.appendChild(star);
    }
  </script>
</body>
</html>
